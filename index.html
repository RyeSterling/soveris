<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soveris</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cexixseswrjpxcudqyto.supabase.co; connect-src 'self' https://cexixseswrjpxcudqyto.supabase.co wss://cexixseswrjpxcudqyto.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">

<style>
:root{--c:#1d1e22;--s:#94a3b8;--m:#5ef0b8;--sf:rgba(148,163,184,.07);--sf2:rgba(148,163,184,.13);--ln:rgba(148,163,184,.16);--t:#f1f5f9}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c);color:var(--t);min-height:100vh}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
.btn{background:var(--m);color:var(--c);border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.9}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.ghost{background:transparent;color:var(--s);border:1px solid var(--ln)}
.btn.ghost:hover{color:var(--t)}
.in{width:100%;padding:11px 13px;border:1px solid var(--ln);border-radius:10px;background:rgba(0,0,0,.25);color:var(--t);outline:none}
.in.sm{width:auto;padding:7px 10px}
.in:focus{border-color:var(--m)}
label{display:block;font-size:13px;font-weight:600;color:var(--s);margin:14px 0 6px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:32px;width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--m);color:var(--c);display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.25);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-top:18px}
.seg button{background:none;border:0;color:var(--s);padding:9px;border-radius:9px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--m);color:var(--c)}
.err{color:var(--m);font-size:13px;min-height:20px;margin-top:12px}
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:rgba(0,0,0,.22);border-right:1px solid var(--ln);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{padding:0 10px 22px}
.me{display:flex;gap:11px;align-items:center;padding:12px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-bottom:20px;cursor:pointer}
.me b{display:block;font-size:14px}
.me small{color:var(--s);font-size:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--m);color:var(--c);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.avatar.sm{width:36px;height:36px;font-size:12px}
.avatar.lg{width:64px;height:64px;font-size:22px}
.navt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--s);padding:4px 12px 8px}
.nav{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--s);font-size:14px;border:0;background:none;width:100%;text-align:left;margin-bottom:3px;position:relative}
.nav:hover{background:var(--sf);color:var(--t)}
.nav.on{background:var(--sf2);color:var(--t);font-weight:600}
.nav.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--m)}
.ic{width:18px;text-align:center}
.main{padding:30px 34px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.top h1{margin:0;font-size:26px}
.top p{margin:6px 0 0;color:var(--s);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:22px;min-width:0}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.gap{margin-top:18px}
.stat{display:flex;gap:14px;align-items:center}
.dot{width:46px;height:46px;border-radius:14px;background:rgba(94,240,184,.1);color:var(--m);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.lbl{font-size:13px;color:var(--s)}
.val{font-size:24px;font-weight:800}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.sec h2{margin:0;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.row.end{justify-content:flex-end}
.muted{color:var(--s);font-size:13px}
.mint{color:var(--m)}
.pill{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--ln);color:var(--s);white-space:nowrap}
.pill.m{color:var(--m);border-color:rgba(94,240,184,.3);background:rgba(94,240,184,.1)}
.rank{width:40px;height:40px;border-radius:12px;background:var(--m);color:var(--c);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.mission{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:opacity .45s,transform .45s}
.mission:hover,.topic:hover{border-color:rgba(94,240,184,.45)}
.mission.fade{opacity:0;transform:translateX(16px)}
.mt{display:flex;justify-content:space-between;align-items:center}
.mission h3,.topic h3{margin:0;font-size:17px}
.topic{cursor:pointer}
.item{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid var(--ln);border-radius:14px;background:var(--sf)}
.file{width:46px;height:52px;border-radius:9px;border:1px solid var(--ln);color:var(--m);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);flex-shrink:0}
.thumb{height:90px;border-radius:14px;display:flex;align-items:flex-end;padding:12px;font-weight:700;border:1px solid var(--ln);background:linear-gradient(160deg,rgba(94,240,184,.22),rgba(0,0,0,.2))}
.course{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:7px 15px;border-radius:20px;border:1px solid var(--ln);color:var(--s);cursor:pointer;font-size:13px}
.chip.on{background:var(--m);color:var(--c);border-color:var(--m);font-weight:700}
.officer{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln)}
.officer:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--s);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px 8px;border-bottom:1px solid var(--ln)}
td{padding:12px 8px;border-bottom:1px solid var(--ln)}
.desc{line-height:1.7;white-space:pre-wrap;margin:14px 0 0}
.empty{color:var(--s);text-align:center;padding:22px 0;font-size:14px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail{background:rgba(0,0,0,.2);border:1px solid var(--ln);border-radius:12px;padding:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mcard{background:var(--c);border:1px solid var(--ln);border-radius:18px;padding:26px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.mcard h2{margin:0;font-size:18px}
@media (max-width:900px){#app{grid-template-columns:1fr}.side{position:static;height:auto}.g2,.g3,.g4{grid-template-columns:1fr}}

/* ===== Sidebar structure ===== */
.navg{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--s);padding:16px 12px 6px;opacity:.8}
.navg:first-child{padding-top:0}
.nav{padding:9px 12px;margin-bottom:2px}
.sfoot{margin-top:auto;padding-top:16px;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:12px}
.themebox{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--s);padding:4px}
.switch{width:44px;height:24px;border-radius:20px;border:1px solid var(--ln);background:var(--sf2);position:relative;cursor:pointer;padding:0;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--m);transition:transform .2s}
body.light .switch::after{transform:translateX(20px)}

/* ===== Calendar grid ===== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dh{font-size:11px;color:var(--s);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding:6px 0;font-weight:700}
.day{min-height:96px;border:1px solid var(--ln);border-radius:12px;padding:7px;background:rgba(0,0,0,.18);cursor:pointer;overflow:hidden;min-width:0}
.day:hover{border-color:rgba(94,240,184,.45)}
.day.blank{border-color:transparent;background:none;cursor:default}
.day.today{border-color:var(--m);box-shadow:inset 0 0 0 1px var(--m)}
.day .n{font-weight:700;font-size:13px;color:var(--s);margin-bottom:4px}
.day.today .n{color:var(--m)}
.ev{font-size:11px;padding:3px 6px;border-radius:6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.team{background:rgba(148,163,184,.18);color:var(--t)}
.ev.mission{background:rgba(94,240,184,.16);color:var(--m)}
.ev.course{background:rgba(148,163,184,.3);color:var(--t)}

/* ===== Light theme ===== */
body.light{--c:#f4f6fa;--s:#475569;--m:#34d399;--mt:#047857;--sf:rgba(15,23,42,.04);--sf2:rgba(15,23,42,.08);--ln:rgba(15,23,42,.12);--t:#0f172a;color-scheme:light}
body.light .btn,body.light .avatar,body.light .rank,body.light .chip.on,body.light .seg button.on,body.light .logo{color:#0f172a}
body.light .btn.ghost{color:var(--s)}
body.light .btn.ghost:hover{color:var(--t)}
body.light .mint,body.light .pill.m,body.light .ev.mission{color:var(--mt)}
body.light .pill.m{border-color:rgba(4,120,87,.3)}
body.light .side,body.light .detail,body.light .file{background:rgba(15,23,42,.03)}
body.light .in,body.light .day{background:#fff}
body.light .switch{background:rgba(15,23,42,.1)}

.bdg{margin-left:auto;background:#ef4444;color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}
.bdg.hide{display:none}

/* ===== v2 comfort + auth ===== */
body{font-size:15px;line-height:1.55}
#app{grid-template-columns:272px 1fr}
.side{padding:28px 18px}.nav{padding:12px 14px;font-size:14.5px;margin-bottom:4px}
.main{padding:0;max-width:1320px;width:100%;margin:0 auto}
#main{padding:8px 40px 60px}
.gsearch{position:sticky;top:0;z-index:20;padding:18px 40px 12px;background:linear-gradient(var(--c) 72%,transparent)}
.gsearch .in{height:48px;padding-left:44px;border-radius:14px;background:var(--sf)}
.gico{position:absolute;left:56px;top:31px;color:var(--s);font-size:19px;pointer-events:none}
.gres{position:absolute;left:40px;right:40px;top:70px;background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:6px 18px;max-height:60vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.gres:empty{display:none}
.top{background:linear-gradient(135deg,rgba(94,240,184,.13),var(--sf) 65%);border:1px solid var(--ln);border-radius:20px;padding:28px 30px;margin-bottom:28px;align-items:center}
.top h1{font-size:29px;letter-spacing:-.02em}
.grid{gap:22px}.gap{margin-top:22px}
.card{padding:26px;box-shadow:0 12px 32px -20px rgba(0,0,0,.55);transition:border-color .2s,transform .2s}
.stat{padding:24px}.val{font-size:29px}.sec{margin-bottom:18px}
.row{padding:15px 0}.row:last-child{border-bottom:0}
.empty{border:1px dashed var(--ln);border-radius:14px;padding:30px 16px;margin:6px 0}
.in:focus{box-shadow:0 0 0 3px rgba(94,240,184,.18)}
.btn:focus-visible,.nav:focus-visible,.eye:focus-visible{outline:2px solid var(--m);outline-offset:2px}
.center{overflow-y:auto}
.auth{max-width:460px;padding:36px;box-shadow:0 30px 80px -30px rgba(0,0,0,.65)}
.pwb{position:relative}.pwb .in{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--s);cursor:pointer;padding:8px;display:flex;border-radius:8px}
.eye:hover{color:var(--t)}.eye .sl{display:none}.eye.on .sl{display:block}
.gbtn{width:100%;margin-top:20px;display:flex;gap:10px;justify-content:center;align-items:center}
.or{display:flex;align-items:center;gap:12px;color:var(--s);font-size:12px;margin-top:18px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--ln)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex!important;gap:10px;align-items:flex-start;font-weight:400!important;line-height:1.4}.chk input{width:auto;margin-top:2px}
@media (max-width:900px){#app{grid-template-columns:1fr}#main{padding:8px 18px 44px}.gsearch{padding:14px 18px 8px}.gico{left:32px;top:27px}.gres{left:18px;right:18px;top:62px}.two{grid-template-columns:1fr}.top{padding:22px}}
</style>

function timeLeft(d){
  if(!d) return "No deadline";
  const diff = new Date(d + "T23:59:59") - new Date();
  if(diff < 0) return "Deadline passed";
  const days = Math.floor(diff/864e5), h = Math.floor(diff%864e5/36e5);
  return days > 0 ? `${days} day${days>1?"s":""} ${h} hr${h!==1?"s":""} left` : `${h} hr${h!==1?"s":""} left`;
}

// ---------- Modal and forms ----------
function openModal(t,h){ $("mT").textContent = t; $("mB").innerHTML = h; $("modal").classList.remove("hidden"); }
function closeModal(){ $("modal").classList.add("hidden"); }
function openForm(title, fields, onSave){
  openModal(title, fields.map(f => {
    const v = esc(f.val ?? "");
    if(f.type==="textarea") return `<label>${f.label}</label><textarea class="in" id="f_${f.k}" rows="4">${v}</textarea>`;
    if(f.type==="select") return `<label>${f.label}</label><select class="in" id="f_${f.k}">${f.opts.map(o=>`<option ${o===f.val?"selected":""}>${o}</option>`).join("")}</select>`;
    return `<label>${f.label}</label><input class="in" id="f_${f.k}" type="${f.type||"text"}" value="${v}">`;
  }).join("") + `<div class="row end" style="border:0;margin-top:18px"><button class="btn ghost sm" onclick="closeModal()">Cancel</button><button class="btn sm" id="fSave">Save</button></div>`);
  $("fSave").onclick = async () => {
    const vals = {};
    fields.forEach(f => vals[f.k] = $("f_"+f.k).value.trim());
    const ok = await onSave(vals);
    if(ok !== false){ closeModal(); render(); }
  };
}
async function run(p){
  const { error } = await p;
  if(error){ alert(error.message); return false; }
  return true;
}
async function delRow(table, id){
  if(!confirm("Remove this item?")) return;
  if(await run(sb.from(table).delete().eq("id", id))) render();
}

let fails = 0, lockUntil = 0;
const INFO = ["birthday","phone","address","religion","emergency_contact"];
function setMode(m){
  mode = m;
  $("tLogin").classList.toggle("on", m==="login");
  $("tSign").classList.toggle("on", m==="signup");
  $("nameW").classList.toggle("hidden", m==="login");
  $("signW").classList.toggle("hidden", m==="login");
  $("authBtn").textContent = m==="login" ? "Log in" : "Create account";
  $("pass").autocomplete = m==="login" ? "current-password" : "new-password";
  $("err").textContent = "";
}
function togglePw(id, b){
  const i = $(id), show = i.type === "password";
  i.type = show ? "text" : "password";
  b.classList.toggle("on", show);
  b.setAttribute("aria-label", show ? "Hide password" : "Show password");
}
const pwProblem = p => p.length < 10 ? "Use at least 10 characters." : (!/[a-z]/.test(p) || !/[A-Z]/.test(p) || !/\d/.test(p)) ? "Mix upper-case, lower-case and a number." : "";
async function googleLogin(){
  const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
  if(error) $("err").textContent = error.message;
}
async function auth(){
  const err = m => { $("err").textContent = m; };
  if(Date.now() < lockUntil) return err("Too many attempts. Try again in " + Math.ceil((lockUntil - Date.now())/1000) + "s.");
  const email = $("email").value.trim().toLowerCase(), password = $("pass").value;
  if(!GMAIL.test(email)) return err("Please use your real Gmail address (name@gmail.com).");
  if(!password) return err("Enter your password.");
  err("");
  if(mode === "login"){
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      if(++fails >= 5){ lockUntil = Date.now() + 60000; fails = 0; }
      return err(/confirm/i.test(error.message) ? "Please confirm your email first. Check your Gmail inbox." : "Incorrect email or password.");
    }
    fails = 0; return boot();
  }
  const name = $("name").value.trim(), info = {};
  INFO.forEach(k => info[k] = $("s_" + k).value.trim());
  if(!name) return err("Enter your full name.");
  const pp = pwProblem(password); if(pp) return err(pp);
  if(password !== $("pass2").value) return err("Passwords do not match.");
  if(!info.birthday || new Date(info.birthday) >= new Date()) return err("Enter a valid birthday.");
  if(info.phone.replace(/\D/g,"").length < 7) return err("Enter a valid phone number.");
  if(info.address.length < 5) return err("Enter your address.");
  if(!$("agree").checked) return err("Please tick the agreement box.");
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name, info }, emailRedirectTo: location.origin + location.pathname } });
  if(error) return err(error.message);
  if(!data.session) return err("Almost done! Open your Gmail inbox and confirm your account, then log in.");
  boot();
}
const PRIV = [["birthday","Birthday","date"],["phone","Phone number","tel"],["address","Home address","text"],["religion","Religion","text"],["emergency_contact","Emergency contact (name and number)","text"]];
async function syncInfo(u){
  const { data, error } = await sb.from("member_private").select("id").eq("id", u.id).maybeSingle();
  if(error || data) return;
  const i = u.user_metadata?.info;
  if(i && i.birthday && !(await sb.from("member_private").upsert({ id: u.id, ...i })).error) return;
  setTimeout(() => editPrivate(true), 500);
}
async function editPrivate(first){
  const { data } = await sb.from("member_private").select("*").eq("id", me.id).maybeSingle(), d = data || {};
  openModal(first ? "Complete your member details" : "My details",
    '<p class="muted">Only you and the admins can see these.</p>' +
    PRIV.map(([k,l,t]) => `<label>${l}</label><input class="in" id="pv_${k}" type="${t}" value="${esc(d[k] || "")}">`).join("") +
    `<div class="row end" style="border:0;margin-top:18px"><button class="btn ghost sm" onclick="closeModal()">Later</button><button class="btn sm" onclick="savePrivate()">Save</button></div>`);
}
async function savePrivate(){
  const row = { id: me.id }; PRIV.forEach(([k]) => row[k] = $("pv_" + k).value.trim());
  if(!row.birthday || !row.phone || !row.address) return alert("Birthday, phone and address are required.");
  if(await run(sb.from("member_private").upsert(row))) closeModal();
}
async function viewDetails(id){
  if(!isAdmin) return;
  const [{ data: p }, { data: d }] = await Promise.all([sb.from("profiles").select("name").eq("id", id).single(), sb.from("member_private").select("*").eq("id", id).maybeSingle()]);
  openModal(p?.name || "Member", d ? PRIV.map(([k,l]) => `<div class="row"><span class="muted">${l}</span><b style="text-align:right">${esc(d[k] || "—")}</b></div>`).join("") : '<div class="empty">This member has not filled in their details yet.</div>');
}
async function logout(){ await sb.auth.signOut(); location.reload(); }
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return;
  if(!GMAIL.test(session.user.email || "")){ await sb.auth.signOut(); $("err").textContent = "Only Gmail accounts can use Soveris."; return; }
  const { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if(error || !data){ $("err").textContent = "Could not load your profile: " + (error?.message || "not found"); return; }
  me = data;
  isAdmin = me.role === "admin";
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  buildNav();
  refreshMe();
  go("dashboard");
  syncInfo(session.user);
}

const NAV = [
  ["dashboard","◉","Dashboard"],["missions","⚑","Missions"],["library","▤","Library"],["courses","▶","Courses"],
  ["calendar","▦","Calendar"],["forum","💬","Forum"],["intro","★","Introduction"],["ranks","▲","Ranks"],
  ["about","ⓘ","About Us"],["messages","✉","Messages"],["leaderboard","🏆","Leaderboards"],["contacts","☎","Contacts"],
  ["profile","◐","My Profile"],["settings","⚙","Settings"]
];
let navSeq = 0, LAST_VIEW = null, LAST_HTML = "";
async function go(v){
  cur = v;
  const seq = ++navSeq;
  const changed = v !== LAST_VIEW;
  document.querySelectorAll(".nav").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if(!$("main").innerHTML.trim()){ $("main").innerHTML = '<div class="empty">Loading…</div>'; LAST_HTML = ""; }
  const V = {dashboard, missions:missionsView, library:libraryView, courses:coursesView, calendar:calendarView,
    forum:forumView, intro:introView, ranks:ranksView, profile:profileView, members:membersView,
    about:aboutView, messages:messagesView, leaderboard:leaderboardView, contacts:contactsView,
    reports:reportsView, settings:settingsView, requests:requestsView};
  const html = await V[v]();
  if(seq !== navSeq) return;
  if(html !== LAST_HTML){ $("main").innerHTML = html; LAST_HTML = html; }
  if(changed){ window.scrollTo(0,0); LAST_VIEW = v; }
  updateBadges();
}
function render(){ go(cur); }

async function openLog(){
  const { data } = await sb.from("time_logs").select("*").eq("user_id", me.id).is("clock_out", null).order("clock_in", {ascending:false}).limit(1);
  return data && data[0];
}
async function clock(){
  const o = await openLog();

  else await sb.from("time_logs").insert({user_id: me.id, clock_in: new Date().toISOString()});
  render();
}

async function takeMission(id){
  const { data, error } = await sb.from("missions").update({taken_by: me.id}).eq("id", id).is("taken_by", null).select();

  if(!data || !data.length){ alert("Sorry, someone just took this mission."); closeModal(); render(); return; }
  closeModal();
  const el = document.getElementById("m" + id);
  if(el) el.classList.add("fade");
  setTimeout(() => { cur = "profile"; render(); }, 450);
}

// ---------- Dashboard ----------
async function dashboard(){
  const now = new Date(), today = now.toISOString().slice(0,10);
  const [ms, open, ev, topics, ps, clockedIn] = await Promise.all([
    sb.from("missions").select("*").order("due_date"),
    openLog(),
    sb.from("events").select("*").gte("event_date", today).order("event_date").limit(4),
    sb.from("forum_topics").select("id,title,created_at,profiles(name)").order("created_at", {ascending:false}).limit(3),
    sb.from("profiles").select("id,name,role,position,created_at").order("created_at", {ascending:false}),
    sb.from("time_logs").select("id").is("clock_out", null)
  ]);
  const all = ms.data || [];
  MS = all;
  const openM = all.filter(m => !m.taken_by);
  const mine = all.filter(m => m.taken_by === me.id);
  const takenAll = all.filter(m => m.taken_by);
  const profiles = ps.data || [];
  const hour = now.getHours();
  const greet = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const header = `
  <div class="top">
    <div><h1>${greet}, ${esc(me.name.split(" ")[0])}</h1><p>${now.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})} · <span id="clk">${now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</span></p></div>
    <div class="row" style="border:0;padding:0;gap:8px;justify-content:flex-end">
      ${isAdmin ? `<button class="btn ghost sm" onclick="go('members')">Manage roles</button><button class="btn ghost sm" onclick="go('missions')">Post mission</button>` : ""}
      <button class="btn ${open ? 'ghost' : ''}" onclick="clock()">${open ? 'Time out' : 'Time in'}</button>
    </div>
  </div>`;
  const forumRows = (topics.data || []).map(t => `
    <div class="row" style="cursor:pointer" onclick="openTopic=${t.id};go('forum')">
      <div style="min-width:0"><b>${esc(t.title)}</b><div class="muted">by ${esc(t.profiles?.name || "Member")} · ${fmt(t.created_at)}</div></div>
    </div>`).join("") || '<div class="empty">No forum posts yet.</div>';
  const eventRows = (ev.data || []).map(e => `
    <div class="row"><div><b>${esc(e.title)}</b><div class="muted">${fmt(e.event_date)}</div></div><span class="pill">${esc(e.kind)}</span></div>`).join("")
    || '<div class="empty">No upcoming events.</div>';

  if(!isAdmin){
    const pct = all.length ? Math.round(mine.length / all.length * 100) : 0;
    return header + searchBox() + `
    <div class="grid g4">
      ${stat("⚑","Open missions", openM.length)}
      ${stat("✓","Missions taken", mine.length)}
      ${stat("%","My progress", pct + "%")}
      ${stat("⏱","Clocked in", open ? "Yes" : "No")}
    </div>
    <div class="grid g2 gap">
      <div class="card"><div class="sec"><h2>Nearest deadlines</h2><button class="btn ghost sm" onclick="go('missions')">All missions</button></div>
        ${openM.slice(0,4).map(missionRow).join("") || '<div class="empty">No open missions. Check back soon.</div>'}</div>
      <div class="card"><div class="sec"><h2>Latest forum posts</h2><button class="btn ghost sm" onclick="go('forum')">Forum</button></div>${forumRows}</div>
    </div>
    <div class="grid g2 gap">
      <div class="card"><div class="sec"><h2>Upcoming</h2><button class="btn ghost sm" onclick="go('calendar')">Calendar</button></div>${eventRows}</div>
      <div class="card"><div class="sec"><h2>Quick actions</h2></div>
        <div class="grid g2" style="gap:10px">
          <button class="btn ghost" onclick="go('missions')">Take a mission</button>
          <button class="btn ghost" onclick="go('messages')">Messages</button>
          <button class="btn ghost" onclick="go('library')">Open library</button>
          <button class="btn ghost" onclick="go('profile')">Edit my profile</button>
        </div></div>
    </div>`;
  }

  const count = r => profiles.filter(p => p.role === r).length;
  const attention = openM.filter(m => new Date(m.due_date + "T23:59:59") - now < 3*864e5).slice(0,5);
  const signups = ps.error ? '<div class="empty">Run the created_at step in Supabase to see sign-up dates.</div>'
    : (profiles.slice(0,5).map(p => `
      <div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.position || "Member")} · joined ${fmt((p.created_at || "").slice(0,10))}</div></div>
      <span class="pill ${p.role === 'admin' ? 'm' : ''}">${esc(p.role)}</span></div>`).join("") || '<div class="empty">No members yet.</div>');
  return header + searchBox() + `
  <div class="grid g4">
    ${stat("👥","Members", profiles.length)}
    ${stat("⚑","Open missions", openM.length)}
    ${stat("✓","Taken", takenAll.length)}
    ${stat("⏱","Clocked in now", (clockedIn.data || []).length)}
  </div>
  <div class="grid g2 gap">
    <div class="card"><div class="sec"><h2>My missions</h2><button class="btn ghost sm" onclick="go('missions')">Missions</button></div>
      ${mine.map(missionRow).join("") || '<div class="empty">You have not taken any missions yet.</div>'}</div>
    <div class="card"><div class="sec"><h2>Needs attention</h2></div>
      ${attention.map(missionRow).join("") || '<div class="empty">No open missions due in the next 3 days.</div>'}</div>
  </div>
  <div class="grid g2 gap">
    <div class="card"><div class="sec"><h2>Recent sign-ups</h2><button class="btn ghost sm" onclick="go('members')">All members</button></div>${signups}</div>
    <div class="card"><div class="sec"><h2>Roles</h2></div>
      <div class="row"><span>Members</span><b>${count("member")}</b></div>
      <div class="row"><span>Officers</span><b>${count("officer")}</b></div>
      <div class="row"><span>Admins</span><b>${count("admin")}</b></div></div>
  </div>
  <div class="grid g2 gap">
    <div class="card"><div class="sec"><h2>Upcoming</h2><button class="btn ghost sm" onclick="go('calendar')">Calendar</button></div>${eventRows}</div>
    <div class="card"><div class="sec"><h2>Latest forum posts</h2><button class="btn ghost sm" onclick="go('forum')">Forum</button></div>${forumRows}</div>
  </div>`;
}

// ---------- Calendar (month grid) ----------
let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function calGo(n){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + n, 1); render(); }
async function calendarView(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const last = new Date(y, m + 1, 0);
  const { data } = await sb.from("events").select("*").gte("event_date", ymd(calMonth)).lte("event_date", ymd(last)).order("event_date");
  const ev = data || [];
  const today = ymd(new Date());
  let cells = "";

      <button class="btn ghost sm" onclick="calGo(-1)">‹ Prev</button>

// ---------- Files: upload, download, links ----------
let LIB = [], COURSES = [], pendingPhoto = null;
const okLink = s => /^https?:\/\//.test(s);
function safeFile(f, kind){
  const max = kind === "img" ? 2e6 : 15e6;
  if(f.size > max){ alert("File too large (max " + max/1e6 + " MB)."); return false; }
  if(kind === "img" && !/^image\/(png|jpe?g|webp|gif)$/.test(f.type)){ alert("Please choose a PNG, JPG, WEBP or GIF image."); return false; }
  if(/\.(exe|bat|cmd|sh|js|html?|svg|php|msi|scr|jar)$/i.test(f.name)){ alert("This file type is not allowed."); return false; }
  return true;
}
async function uploadFile(file){
  if(!safeFile(file,"doc")) return null;
  const path = `${Date.now()}-${file.name.replace(/[^\w.\-]/g, "_")}`;
  const { error } = await sb.storage.from("library").upload(path, file);
  if(error){ alert(error.message); return null; }
  return path;
}
async function openRef(x){
  if(!x) return;
  const link = x.link_url || x.content_url;
  if(link){ window.open(link, "_blank", "noopener"); return; }
  const path = x.file_path || x.content_path;
  if(!path) return;
  const { data, error } = await sb.storage.from("library").createSignedUrl(path, 300);
  if(error) return alert(error.message);
  const a = document.createElement("a");
  a.href = data.signedUrl; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}
const openLib = i => openRef(LIB[i]);
const openCourse = i => openRef(COURSES[i]);

        <div class="muted" style="margin-top:6px">JPG or PNG</div></div>
      <input type="file" id="pPhoto" accept="image/*" class="hidden"></div>
    <label>Full name</label><input class="in" id="pName" value="${esc(me.name)}">
    <label>Team</label><input class="in" id="pTeam" value="${esc(me.team || "")}">
    <label>About you</label><textarea class="in" id="pBio" rows="3">${esc(me.bio || "")}</textarea>
    <p class="muted" style="margin-top:14px">Your position and role are set by an admin.</p>
    <div class="row end" style="border:0;margin-top:14px"><button class="btn ghost sm" onclick="closeModal()">Cancel</button><button class="btn sm" onclick="saveProfile()">Save</button></div>`);
  $("pPhoto").onchange = e => { pendingPhoto = e.target.files[0] || null; };
}
async function saveProfile(){
  let photo_url = me.photo_url;
  if(pendingPhoto){ photo_url = await uploadAvatar(pendingPhoto); if(!photo_url) return; }
  const ok = await run(sb.from("profiles").update({
    name: $("pName").value.trim() || me.name, team: $("pTeam").value.trim(), bio: $("pBio").value.trim(), photo_url
  }).eq("id", me.id));
  if(!ok) return;
  const { data } = await sb.from("profiles").select("*").eq("id", me.id).single();
  if(data) me = data;
  refreshMe(); closeModal(); render();
}

// ---------- Sidebar: groups (My Profile removed, opened from your name) ----------
const GROUPS = [
  ["Overview",     ["dashboard","calendar"]],
  ["Work",         ["missions","courses","library"]],
  ["Community",    ["forum","messages","contacts","leaderboard"]],
  ["Organisation", ["intro","ranks","about"]],
  ["Admin",        ["requests","members","reports"], true],
  ["Account",      ["settings"]]
];
const EXTRA = [["requests","✋","Requests"],["members","👥","Members"],["reports","▥","Reports"]];
function buildNav(){
  const all = Object.fromEntries([...NAV, ...EXTRA].map(n => [n[0], n]));
  $("nav").innerHTML = GROUPS.filter(g => !g[2] || isAdmin).map(([title, keys]) =>
    `<div class="navg">${title}</div>` + keys.map(k => {
      const [v, i, l] = all[k];
      return `<button class="nav" data-v="${v}" onclick="go('${v}')"><span class="ic">${i}</span>${l}<span class="bdg hide"></span></button>`;
    }).join("")).join("");
}

// ---------- Search ----------
const searchBox = () => "";
let searchT = null;
function doSearch(q){
  clearTimeout(searchT);
  searchT = setTimeout(async () => {
    q = q.trim();
    const box = $("dsr"); if(!box) return;
    if(q.length < 2){ box.innerHTML = ""; return; }
    const like = `%${q}%`;
    const [m, l, c, f, p] = await Promise.all([
      sb.from("missions").select("id,title,rank").ilike("title", like).limit(5),
      sb.from("library_items").select("id,title,category").ilike("title", like).limit(5),
      sb.from("courses").select("id,title").ilike("title", like).limit(5),
      sb.from("forum_topics").select("id,title").ilike("title", like).limit(5),
      sb.from("profiles").select("id,name,position").ilike("name", like).limit(5)
    ]);
    const section = (name, rows, fn) => rows && rows.length ? `<div class="navg">${name}</div>` + rows.map(fn).join("") : "";
    const html = section("Missions", m.data, x => `<div class="row" style="cursor:pointer" onclick="go('missions')"><b>${esc(x.title)}</b><span class="rank">${esc(x.rank)}</span></div>`)
      + section("Library", l.data, x => `<div class="row" style="cursor:pointer" onclick="go('library')"><b>${esc(x.title)}</b><span class="muted">${esc(x.category)}</span></div>`)
      + section("Courses", c.data, x => `<div class="row" style="cursor:pointer" onclick="go('courses')"><b>${esc(x.title)}</b></div>`)
      + section("Forum", f.data, x => `<div class="row" style="cursor:pointer" onclick="openTopic=${x.id};go('forum')"><b>${esc(x.title)}</b></div>`);
    box.innerHTML = (html + section("Members", p.data, x => `<div class="row" style="cursor:pointer" onclick="go('contacts')"><b>${esc(x.name)}</b><span class="muted">${esc(x.position || "Member")}</span></div>`)) || '<div class="empty">No results.</div>';
  }, 300);
}
// Filter cards in place (no page redraw, so typing is not interrupted)
function filterCards(q, cls){
  q = q.trim().toLowerCase();
  document.querySelectorAll("." + cls).forEach(el => { el.style.display = (el.dataset.t || "").includes(q) ? "" : "none"; });
}

function postForm(){
  return `<div class="card" style="margin-bottom:18px"><div class="sec"><h2>Post a new mission</h2></div>
  <div class="grid" style="grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;align-items:end">

    category: $("pCat").value.trim() || "General"
  }));

async function missionsView(){
  const [ms, pr] = await Promise.all([
    sb.from("missions").select("*").order("due_date"),
    sb.from("profiles").select("id,name")
  ]);

    ${taken.map(m => `<div class="row"><div><b>${esc(m.title)}</b><div class="muted">Taken by ${esc(names[m.taken_by] || "Member")}</div></div><span class="rank">${esc(m.rank)}</span></div>`).join("")}</div>` : ""}`;

function courseForm(){

    : '<div class="card empty">Nothing in this category.</div>'}</div>`;

// ---------- Contacts: reason, 8-hour limit, 3-minute approval ----------
let CONTACT_T = null;
async function contactsView(){
  await sb.from("notifications").update({read: true}).eq("user_id", me.id).eq("kind", "request");
  const [{ data: ps }, { data: pc }, { data: rq }] = await Promise.all([
    sb.from("profiles").select("id,name,position,team,photo_url").order("name"),
    sb.from("private_contacts").select("id,email"),
    sb.from("contact_requests").select("target_id,status,created_at,approved_until").eq("from_id", me.id).order("created_at", {ascending:false})
  ]);
  const emails = Object.fromEntries((pc || []).map(x => [x.id, x.email]));
  const latest = {};
  (rq || []).forEach(r => { if(!latest[r.target_id]) latest[r.target_id] = r; });
  const last = (rq || [])[0];
  const wait = last ? new Date(last.created_at).getTime() + 8*36e5 - Date.now() : 0;
  const timers = [];
  Object.values(latest).forEach(r => {
    if(r.status === "approved" && r.approved_until && new Date(r.approved_until) > new Date()) timers.push(new Date(r.approved_until) - Date.now());
  });
  if(wait > 0) timers.push(wait);
  clearTimeout(CONTACT_T);
  if(timers.length) CONTACT_T = setTimeout(() => { if(cur === "contacts") render(); }, Math.min(...timers) + 1000);
  const waitTxt = wait > 36e5 ? `${Math.ceil(wait/36e5)} h` : `${Math.ceil(wait/6e4)} min`;
  return `
  <div class="top"><div><h1>Contacts</h1><p>Emails are private. Ask with a reason and an admin will decide. An approved email stays visible for 3 minutes.</p></div></div>
  <div class="grid g4">${(ps || []).map(p => {
    const r = latest[p.id];
    let action;
    if(p.id === me.id) action = '<span class="muted">This is you</span>';
    else if(emails[p.id]) action = `<a href="mailto:${esc(emails[p.id])}" style="color:var(--m);font-size:13px;word-break:break-all">${esc(emails[p.id])}</a>
        ${r && r.approved_until ? `<div class="muted" style="margin-top:6px;font-size:12px">Hides at ${time(r.approved_until)}</div>` : ''}`;
    else if(r && r.status === "pending") action = '<span class="pill">Waiting for admin</span>';
    else if(wait > 0) action = `<span class="pill">Next request in ${waitTxt}</span>`;
    else action = `<button class="btn ghost sm" onclick="requestEmail('${p.id}')">Request email</button>`;
    return `<div class="card" style="text-align:center">
      <div style="display:flex;justify-content:center">${av(p, 54)}</div>
      <b style="display:block;margin-top:12px">${esc(p.name)}</b>
      <div class="muted">${esc(p.position || "Member")}${p.team ? ' · ' + esc(p.team) : ''}</div>
      <div style="margin-top:12px">${action}</div></div>`;
  }).join("")}</div>`;
}
async function requestEmail(id){
  const { data } = await sb.from("profiles").select("name").eq("id", id).single();
  openModal(`Request email for ${data?.name || "this member"}`, `
    <label style="margin-top:0">Why do you want to see this email?</label>
    <textarea class="in" id="rReason" rows="3" placeholder="For example: we are working on the same project together."></textarea>
    <p class="muted" style="margin-top:10px">An admin reviews your reason. If approved, the email stays visible for 3 minutes. You can send one request every 8 hours.</p>
    <div class="row end" style="border:0;margin-top:14px"><button class="btn ghost sm" onclick="closeModal()">Cancel</button><button class="btn sm" onclick="sendRequest('${id}')">Send request</button></div>`);
}
async function sendRequest(id){
  const reason = $("rReason").value.trim();
  if(reason.length < 10) return alert("Please write a reason (at least 10 characters).");
  if(await run(sb.from("contact_requests").insert({from_id: me.id, target_id: id, reason}))){ closeModal(); render(); }
}

// ---------- Requests (admin) ----------
async function requestsView(){
  if(!isAdmin) return '<div class="card empty">Admins only.</div>';
  await sb.from("notifications").update({read: true}).eq("user_id", me.id).eq("kind", "request");
  const [{ data: rq }, { data: pr }] = await Promise.all([
    sb.from("contact_requests").select("*").order("created_at", {ascending:false}),
    sb.from("profiles").select("id,name")
  ]);
  const names = Object.fromEntries((pr || []).map(p => [p.id, p.name]));
  const list = rq || [];
  return `
  <div class="top"><div><h1>Requests</h1><p>Approve a request to show that email for 3 minutes.</p></div></div>
  <div class="card">${list.length ? list.map(r => `
    <div class="row" style="align-items:flex-start">
      <div style="min-width:0"><b>${esc(names[r.from_id] || "Member")}</b> asked for the email of <b>${esc(names[r.target_id] || "Member")}</b>
        <div class="desc" style="margin-top:6px">“${esc(r.reason || "No reason given")}”</div>
        <div class="muted" style="margin-top:4px">${fmt(r.created_at.slice(0,10))} ${time(r.created_at)}</div></div>
      ${r.status === "pending"
        ? `<div style="display:flex;gap:8px;flex-shrink:0"><button class="btn sm" onclick="decide(${r.id},'approved')">Approve</button><button class="btn ghost sm" onclick="decide(${r.id},'denied')">Decline</button></div>`
        : `<span class="pill ${r.status === 'approved' ? 'm' : ''}">${r.status === 'approved' && r.approved_until ? 'Approved until ' + time(r.approved_until) : esc(r.status)}</span>`}
    </div>`).join("") : '<div class="empty">No requests yet.</div>'}</div>`;
}

// ---------- Start ----------
document.addEventListener("click", e => { const r = $("dsr"); if(!r) return; if(!e.target.closest(".gsearch") || e.target.closest("#dsr .row")) setTimeout(() => { r.innerHTML = ""; if(e.target.closest("#dsr .row")) $("gq").value = ""; }, 0); });
let idleT; const bump = () => { clearTimeout(idleT); if(me) idleT = setTimeout(logout, 30*60000); };
["click","keydown","mousemove","touchstart"].forEach(ev => addEventListener(ev, bump, { passive: true }));
applyTheme();
sb.auth.onAuthStateChange((event, session) => { if(session) startLive(); });
setMode("login");
boot();
</script>
